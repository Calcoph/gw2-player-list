[package]
name = "player-list"
version = "0.3.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arcdps = { git = "https://github.com/zerthox/arcdps-bindings", features = ["extras"], rev = "9deb6990b9c9c837983e2e44b75d996b799afd02" }
once_cell = "1.21.4"
toml = "1.1.2"
windows = { version = "0.62.2", features = ["System"] }
reqwest = { version = "0.13.5", features = ["blocking"]}
serde_json = "1.0.151"
const_format = "0.2.36"

[lib]
crate-type = ["cdylib"]

[patch."https://github.com/zerthox/arcdps-bindings"]
arcdps = { git = "https://github.com/cheahjs/Zerthox-arcdps-bindings", rev = "9cbf6a65a8cb20512e8e711eeb4f92203dc22882" }
